name = "cor-contact-chat"
main = "src/index.ts"
compatibility_date = "2025-01-09"
compatibility_flags = ["nodejs_compat"]
# cor-jp.com ゾーンを持つアカウント（Company@cor-jp.com）。yomimono と同一アカウント。
account_id = "9973f2d2304b58a1f90d4d9409e9f8cc"

# cor-jp.com の /api/contact* だけをこの Worker に流す（HP本体は Firebase のまま）。
# 問い合わせウィジェットは cor-jp.com 上に置かれ、同一オリジンで叩く（CORSなし）。
routes = [{ pattern = "cor-jp.com/api/contact/*", zone_name = "cor-jp.com" }]
# workers.dev（<name>.<アカウントのサブドメイン>.workers.dev）と、版ごとのプレビュー URL
# （<版の先頭 8 桁>-<name>.<サブドメイン>.workers.dev）では公開しない。本番は上の routes（cor-jp.com）だけで受ける。
# どちらも書かないと wrangler が環境や版で既定を決める（3.114 は preview_urls の既定が true）ので、明示する（#362）。
# workers-dev-exposure.test.ts が、すべての環境に workers_dev と preview_urls の明示を求める。
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/15 * * * *"]

# 公開可能な設定値（非シークレット）。
[vars]
# LLM プロバイダ。'vertex-gemini'（既定。Cloud Run の Gateway 経由）か 'anthropic'。ほかの値は 503（src/llm.ts の getProvider）。
LLM_PROVIDER = "vertex-gemini"
GOOGLE_CLOUD_PROJECT = "cor-jp-web"
GOOGLE_CLOUD_LOCATION = "global"
VERTEX_MODEL = "gemini-3.5-flash"
# 1 日（JST の日付）に model を呼ぶ回数の上限（チャットの API）。0 以上の整数。0 はその日は呼ばない。
CHAT_DAILY_MODEL_CALL_LIMIT = "300"
# 問い合わせメールの宛先/差出人（PIIではなく運用設定。シークレットにしてもよい）。
CONTACT_TO_EMAIL = "cloudia@cor-jp.com"
CONTACT_CC_EMAILS = "company@cor-jp.com,nagisa.terada@cor-jp.com"
CONTACT_FROM_EMAIL = "noreply@cor-jp.com"
# 資料請求の社内通知。live は、解放時刻（10 桁の unix 秒）以降に作られた行だけを送る。解放時刻より前に作られた行は保留のまま
# 送らない。配備が終わる予定より後の時刻にする。時刻が動く時は、この 1 行だけを直す。
DOCUMENT_REQUEST_NOTIFY_MODE = "live"
DOCUMENT_REQUEST_NOTIFY_RELEASED_AT = "1795230600"   # 2026-11-21 12:10 JST

# D1 stores redacted session metadata and encrypted, short-lived submit data.
[[d1_databases]]
binding = "DB"
database_name = "cor-contact-chat-prod"
database_id = "f6a1c052-9dac-46e4-9547-ecf0bc3236ef"
migrations_dir = "migrations"

# Queue payloads contain only a submission ID; PII remains encrypted in D1.
[[queues.producers]]
binding = "CONTACT_NOTIFICATIONS"
queue = "cor-contact-notifications"

[[queues.consumers]]
queue = "cor-contact-notifications"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "cor-contact-notifications-dlq"

[env.preview]
name = "cor-contact-chat-preview"
routes = []
# workers.dev とプレビュー URL では公開しない。routes が空のとき wrangler は workers.dev を既定で有効にする。
# 2026-10-01、このプレビュー（cor-contact-chat-preview）は workers.dev で外から届き、Origin の無い POST を通していた（#362）。
# workers-dev-exposure.test.ts が、すべての環境に workers_dev と preview_urls の明示を求める。
workers_dev = false
preview_urls = false

[env.preview.triggers]
crons = ["*/15 * * * *"]

[env.preview.vars]
LLM_PROVIDER = "vertex-gemini"
GOOGLE_CLOUD_PROJECT = "cor-jp-web"
GOOGLE_CLOUD_LOCATION = "global"
VERTEX_MODEL = "gemini-3.5-flash"
# 1 日（JST の日付）に model を呼ぶ回数の上限。preview の数は preview の D1 で別に数える。
CHAT_DAILY_MODEL_CALL_LIMIT = "300"
CONTACT_TO_EMAIL = "cloudia@cor-jp.com"
CONTACT_CC_EMAILS = "company@cor-jp.com,nagisa.terada@cor-jp.com"
CONTACT_FROM_EMAIL = "noreply@cor-jp.com"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "cor-contact-chat-preview"
database_id = "644573b2-1dd4-4f8d-988e-de581270fb45"
migrations_dir = "migrations"

[[env.preview.queues.producers]]
binding = "CONTACT_NOTIFICATIONS"
queue = "cor-contact-notifications-preview"

[[env.preview.queues.consumers]]
queue = "cor-contact-notifications-preview"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "cor-contact-notifications-preview-dlq"

# 未適用。資料請求を cor-os の専用入口へ同期する service binding。
# 有効化、資格の作成、このブロックのコメント解除は別承認。ここを外してもコードは呼ばない。
# [[services]]
# binding = "DOCUMENT_REQUEST_CASE_SYNC"
# service = "cor-os-workbench"
# entrypoint = "DocumentRequestCaseSync"

# シークレットは `wrangler secret put <NAME>` で登録（値はコードに出ない）:
#   ANTHROPIC_API_KEY   ... Claude（LLM_PROVIDER=anthropic のとき必須。未設定なら fail closed）
#   VERTEX_GATEWAY_URL  ... Cloud Run Gatewayの /generateContent URL
#   VERTEX_GATEWAY_SECRET ... Gatewayと共有するHMAC secret
#   RESEND_API_KEY      ... Resend のAPIキー（/submit の送信に必須。未設定なら 503 fail closed）
#   TURNSTILE_SECRET    ... 置かない。Cloudia がトークンを送るまで未設定（検証スキップ）。入れるとトークン無しの /submit は 400。
# ↑ 選択したプロバイダの認証情報が未設定だと /chat を拒否（fail closed）。
#   RESEND_API_KEY 未設定だと /submit を 503（本物の問い合わせを握り潰さない）。
