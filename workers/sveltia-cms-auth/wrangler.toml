# Sveltia CMS Authenticator — CMS（https://cor-jp-cms.web.app/）の「GitHub にログイン」を仲介する Worker。
# ADR-0018（#329）。src/index.js は上流 sveltia/sveltia-cms-auth のコードをそのまま置いている（README.md 参照）。
# 上流の wrangler.toml から変えたのは name・account_id・workers_dev・[vars] とコメントだけ。
name = "cor-sveltia-cms-auth"
main = "src/index.js"
compatibility_date = "2023-03-24"
# cor-jp.com ゾーンを持つアカウント（Company@cor-jp.com）。workers/contact-chat と同じ。
account_id = "9973f2d2304b58a1f90d4d9409e9f8cc"

# route は置かない。https://cor-sveltia-cms-auth.<アカウントの workers.dev サブドメイン>.workers.dev で動かし、
# その URL を cms/public/config.yml の backend.base_url に書く。
workers_dev = true

[vars]
# トークンを渡してよい CMS のホスト名（完全一致）。CMS 専用の Firebase Hosting サイトだけにする。
# - 空にしない: 上流の Worker は空のとき、どのオリジンの CMS にもトークンを渡す。
# - * を使わない・プレビューチャネル（--）や develop のホストを入れない: 誰でもコードを載せられる場所になる。
# cms/firebase.json の hosting.site と src/config/__tests__/cms-config.test.ts で照合している（片方だけ変えると落ちる）。
# デプロイのたびにこの値で上書きされるので、現在値は git で確認できる（secret にはしない）。
ALLOWED_DOMAINS = "cor-jp-cms.web.app"

# secret（値はここに書かない）。`wrangler secret put <NAME>` で登録する。再デプロイしても消えない。
#   GITHUB_CLIENT_ID      ... GitHub OAuth App の Client ID
#   GITHUB_CLIENT_SECRET  ... GitHub OAuth App の Client secret（秘密）
# 使わない設定: GITHUB_HOSTNAME（GitHub Enterprise 用）、GITLAB_CLIENT_ID / GITLAB_CLIENT_SECRET / GITLAB_HOSTNAME
