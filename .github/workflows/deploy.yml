name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    # develop 宛 PR にもプレビューチャネル（pr<番号>-<ブランチ名先頭20字>、30 日で失効）を作る。
    # CMS（ADR-0018）の「プレビューを見る」は、下の Preview ステップが作る "Deploy Preview" check run の URL を読む。
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

# 同じ PR の実行は 1 本ずつにし、古い run は取り消す。CMS（ADR-0018）から続けて保存したとき、
# 古い run が後から終わってプレビューチャネルを古い内容で上書きしないようにするため。
# push（本番・develop チャネル）と手動実行は取り消さず順に実行する（待機中の run は新しい run に置き換わる）。
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type checking and build
        run: npm run build
        env:
          PUBLIC_GCAL_ID: ${{ secrets.PUBLIC_GCAL_ID || '' }}
          PUBLIC_GCAL_TZ: ${{ secrets.PUBLIC_GCAL_TZ || 'Asia/Tokyo' }}
          PUBLIC_GCAL_PARAMS: ${{ secrets.PUBLIC_GCAL_PARAMS || '' }}
          PUBLIC_STRIPE_PAYMENT_LINK: ${{ secrets.PUBLIC_STRIPE_PAYMENT_LINK || '' }}
          PUBLIC_YOUTUBE_API_KEY: ${{ secrets.PUBLIC_YOUTUBE_API_KEY || '' }}
          # ADR-0010: Grift base URL（未設定時は production 既定。Preview は secrets で上書き）
          PUBLIC_GRIFT_BASE_URL: ${{ vars.PUBLIC_GRIFT_BASE_URL || secrets.PUBLIC_GRIFT_BASE_URL || 'https://griftai.org' }}
          # main のみ production。PR / develop は preview → noindex
          PUBLIC_SITE_ENV: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'production' || 'preview' }}
          # 計測タグ（#51）。未設定なら Analytics.astro は何も出力しない。
          # Preview / PR ビルドには渡さない: 社内のプレビュー閲覧までセッション録画・計測され
          # 解析データが汚染されるため（Analytics.astro 側でも production 以外は出力しない）。
          PUBLIC_CLARITY_ID: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.PUBLIC_CLARITY_ID || '' }}
          PUBLIC_CF_BEACON_TOKEN: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.PUBLIC_CF_BEACON_TOKEN || '' }}

      - name: Debug Firebase service account secret
        # secret はシェルのスクリプトに直接展開せず、環境変数で渡す。
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COR_JP_WEB }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "❌ Missing FIREBASE_SERVICE_ACCOUNT_COR_JP_WEB secret"
            exit 1
          fi
          echo "✅ FIREBASE_SERVICE_ACCOUNT_COR_JP_WEB secret is set"

      - name: Deploy to Firebase Hosting (Preview)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@120e124148ab7016bec2374e5050f15051255ba2 # v0.7.1
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COR_JP_WEB }}
          projectId: cor-jp-web
          expires: 30d

      - name: Deploy to Firebase Hosting (Develop preview)
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@120e124148ab7016bec2374e5050f15051255ba2 # v0.7.1
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COR_JP_WEB }}
          projectId: cor-jp-web
          channelId: develop
          expires: 30d

      - name: Deploy to Firebase Hosting (Production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@120e124148ab7016bec2374e5050f15051255ba2 # v0.7.1
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COR_JP_WEB }}
          projectId: cor-jp-web
          channelId: live
