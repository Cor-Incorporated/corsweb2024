name: CI

# PR ごとにユニットテスト・ビルド・dist の監査と回帰ガードを走らせる（Issue #323）。
# 以前はルート（src/・tests/）の vitest も dist の監査（security:audit:dist）も、どのワークフローでも
# 実行されていなかった（workers/yomimono の vitest だけは deploy-yomimono-worker.yml が実行していた）。
# develop 宛 PR の build は visual-text.yml（2026-07-02〜）が表示監査の前段として走らせるだけだった。
# テストを足すだけでは動かないため、アサーションとこの実行経路はセットで扱う。
#
# ジョブ名 `verify` は main のブランチ保護で required check に指定する想定の名前。
# 変えると必須チェックが「待機中」のまま止まるので、変える場合は保護設定と同時に行うこと。

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR は番号単位にし、同じ PR の古い実行を取り消す。
  # push / 手動実行は SHA 単位にする。cancel-in-progress: false でも、同じ group で待機中の実行は
  # 後から来た実行に置き換えられて取り消されるため、ref 単位だと develop への連続マージで検証が抜ける。
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('sha-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # actions はタグではなくコミット SHA で固定する（タグの付け替えで中身が変わるのを防ぐ）。
      # 上げるときは `gh api repos/actions/<name>/git/ref/tags/<tag>` で SHA を確かめてから書き換える。
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ワークフロー（.github/workflows/）を actionlint で検査する。shellcheck も版を固定して渡す（runner に入っている
      # shellcheck の版で結果が変わらないように）。pyflakes は使わない（runner にあるかどうかで結果が変わるため）。
      # 2026-10-01 まで CI では動かしておらず、手元の版でだけ SC2016 が見つかっていた（#371）。
      # 版を上げるときは URL と sha256 を同時に書き換え、sha256 はリリースの digest で確かめる:
      #   gh api repos/rhysd/actionlint/releases/tags/<tag> --jq '.assets[] | "\(.name) \(.digest)"'
      # 照合: src/config/__tests__/actionlint-gate.test.ts（版の一致・sha256 の照合・shellcheck の受け渡し）
      - name: Lint workflows (actionlint + shellcheck, pinned)
        env:
          ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          SHELLCHECK_URL: https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          SHELLCHECK_SHA256: 'b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6'
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/lint-tools"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/actionlint.tar.gz" "$ACTIONLINT_URL"
          echo "${ACTIONLINT_SHA256}  $tools/actionlint.tar.gz" | sha256sum -c -
          curl -fsSL --retry 3 -o "$tools/shellcheck.tar.gz" "$SHELLCHECK_URL"
          echo "${SHELLCHECK_SHA256}  $tools/shellcheck.tar.gz" | sha256sum -c -
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          tar -xzf "$tools/shellcheck.tar.gz" -C "$tools" --strip-components=1 --wildcards '*/shellcheck'
          "$tools/shellcheck" --version
          "$tools/actionlint" -version
          "$tools/actionlint" -shellcheck "$tools/shellcheck" -pyflakes= -color

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          # workers/contact-edge は独自の package-lock.json を持つので、キャッシュの鍵に含める。
          cache-dependency-path: |
            package-lock.json
            workers/contact-edge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:run

      # workers/contact-edge（/contact/chat/ を配信する Worker）は独自の package.json を持ち、ルートの
      # vitest には含まれない。テストの実行に依存パッケージのインストールスクリプトは不要なので
      # --ignore-scripts で入れる（wrangler / workerd の postinstall を走らせない）。
      - name: contact-edge worker tests
        run: |
          npm ci --prefix workers/contact-edge --ignore-scripts --no-audit --no-fund
          npm test --prefix workers/contact-edge

      - name: Type check and build
        run: npm run build
        env:
          # まずカレンダー未設定の状態でビルドする。#323 背景 4（説明文だけが「打ち合わせ可能な時間」を
          # 断言する）はこの状態でしか顕在化しない。カレンダー表示ありの状態は後段で別にビルドする。
          # 秘密情報はこのジョブに渡さない。
          PUBLIC_GCAL_ID: ''

      # dist の SEO メタ・JSON-LD・秘密情報らしき文字列・非 HTTPS / 開発用オリジン・localStorage の
      # キー・重い UI ランタイムの混入を検査する（scripts/audit-dist-security.mjs）。
      - name: Dist security and SEO audit
        run: npm run security:audit:dist

      # CONTACT_GUARD_EXPECT_CALENDAR はこのビルドの条件（'0' = カレンダーなし）。テストは 5 言語の
      # /contact でカレンダーの描画有無がこの値と一致することを確かめる（空振りの検知）。
      - name: Contact regression guards on dist
        run: npm run test:dist
        env:
          CONTACT_GUARD_EXPECT_CALENDAR: '0'

      # 本番（deploy.yml）は PUBLIC_GCAL_ID を渡してビルドするため、カレンダー表示時だけ /contact に出る
      # 文言（calendar.note・FALLBACK_WITH_CALENDAR）と、B-2 の逆向き（calendar-without-claim）は
      # 上の未設定ビルドでは検査できない。ダミーの ID でもう一度ビルドし、同じ回帰ガードを当てる。
      # ID はビルド時に埋め込み URL の文字列になるだけで、外部には出ない。型検査は上で済んでいるので
      # astro build だけを実行し、出力は作業ツリーの外（RUNNER_TEMP）に置く。
      - name: Build with the calendar enabled (dummy ID)
        run: npm run astro -- build --outDir "$RUNNER_TEMP/dist-calendar"
        env:
          PUBLIC_GCAL_ID: contact-guard-dummy@example.invalid

      # 本番と同じカレンダーありの HTML も、PR の段階で監査する。デプロイ直前の監査は deploy.yml 側の担当（#341）。
      - name: Dist security and SEO audit (calendar enabled)
        run: AUDIT_DIST_DIR="$RUNNER_TEMP/dist-calendar" npm run security:audit:dist

      - name: Contact regression guards on dist (calendar enabled)
        run: CONTACT_GUARD_DIST_DIR="$RUNNER_TEMP/dist-calendar" npm run test:dist
        env:
          CONTACT_GUARD_EXPECT_CALENDAR: '1'

      # firebase.json のヘッダー（キャッシュ・セキュリティヘッダー）の基準監査。ビルド不要で 1 秒未満。
      # 以前はどのワークフローでも実行されず、手動でしか確かめられていなかった。
      - name: Firebase hosting header audit
        run: npm run security:audit:firebase

      - name: Worker security header audit
        run: npm run security:audit:workers

      # CMS の配信（deploy-cms.yml）は main への push でしか動かないので、ピン留めした firebase-tools の
      # 単体バイナリが deploy の処理を読み込めることを、ここ（PR の段階）で確かめる。資格情報は使わない。
      # URL と sha256 は deploy-cms.yml と同じ値にする（src/config/__tests__/cms-deploy.test.ts が照合する）。
      # 2026-09-30 の初回配信（run 36678478928）は v15.31.0 で exit 2 になり止まった: 単体バイナリが同梱する
      # Node 20.18.2 では、ESM 専用になった依存（stream-chain）を require() できない（firebase-tools #11168）。
      - name: Pinned firebase-tools binary (same as deploy-cms.yml) can load the deploy command
        env:
          FIREBASE_TOOLS_URL: https://github.com/firebase/firebase-tools/releases/download/v15.32.1/firebase-tools-linux
          FIREBASE_TOOLS_SHA256: '790d991658b7ea9a009a947721944b03695c7f3d97bdcddc887857c1a7671118'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/firebase" "$FIREBASE_TOOLS_URL"
          echo "${FIREBASE_TOOLS_SHA256}  $RUNNER_TEMP/firebase" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/firebase"
          "$RUNNER_TEMP/firebase" hosting:channel:deploy --help
