name: CI

# PR ごとにユニットテスト・ビルド・dist の回帰ガードを走らせる（Issue #323）。
# 以前は vitest がどのワークフローでも実行されていなかった。develop 宛 PR の build は
# visual-text.yml（2026-07-02〜）が表示監査の前段として走らせるだけだった。
# テストを足すだけでは動かないため、アサーションとこの実行経路はセットで扱う。
#
# ジョブ名 `verify` は main のブランチ保護で required check に指定する想定の名前。
# 変えると必須チェックが「待機中」のまま止まるので、変える場合は保護設定と同時に行うこと。

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR は番号単位にし、同じ PR の古い実行を取り消す。
  # push / 手動実行は SHA 単位にする。cancel-in-progress: false でも、同じ group で待機中の実行は
  # 後から来た実行に置き換えられて取り消されるため、ref 単位だと develop への連続マージで検証が抜ける。
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('sha-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # actions はタグではなくコミット SHA で固定する（タグの付け替えで中身が変わるのを防ぐ）。
      # 上げるときは `gh api repos/actions/<name>/git/ref/tags/<tag>` で SHA を確かめてから書き換える。
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:run

      - name: Type check and build
        run: npm run build
        env:
          # カレンダー未設定の状態でビルドする。#323 背景 4（説明文だけが「打ち合わせ可能な時間」を
          # 断言する）はこの状態でしか顕在化しない。設定時の文言は src/config/__tests__/contact-guards.test.ts
          # がソースを読んで検証している。秘密情報はこのジョブに渡さない。
          PUBLIC_GCAL_ID: ''

      - name: Contact regression guards on dist
        run: npm run test:dist

      - name: Worker security header audit
        run: npm run security:audit:workers
