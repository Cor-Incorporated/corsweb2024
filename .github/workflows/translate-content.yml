name: Translate content (i18n)

# ja（src/content/<collection>/ja/*.md）を正本に、en/zh/ko/es を Gemini で差分翻訳する。
# 設計: docs/adr/ADR-0019-i18n-auto-translation.md / 運用: docs/i18n-translation.md
#
# ■ 信頼境界（書き込みトークンと、信頼しないコードを同じジョブに置かない）
#   translate        contents: read だけ。PR head のコード（scripts/i18n と npm 依存）を GEMINI_API_KEY 付きで動かし、
#                    結果を `git diff --binary --no-renames` のパッチとして artifact に渡す（ja の改名は、旧 slug の
#                    翻訳の削除と新 slug の翻訳の追加になる）。`npm ci --ignore-scripts`、npm キャッシュなし。
#   push             contents: write。npm もリポジトリのコードも実行しない。パッチ（信頼しないデータ）の変更パス・
#                    ファイル種別・大きさ・削除件数を検査してから適用し、stage された内容を行ごとに照合して
#                    （追加・変更・削除だけ、mode 100644 だけ、許可パスだけ、.md は NUL なしで 1 行目が ---）から、
#                    hooks を無効にして commit / push する。
#   approve-checks   actions: write だけ。GITHUB_TOKEN で push したとき、翻訳コミットで承認待ちになった pull_request の
#                    実行（必須チェックの verify・Chromium visual text audit・h5-admission と i18n-check を含む）を承認する。
#   i18n-check       contents: read。単体テストと --check（キー不要）。
#   translate-result 権限なし。翻訳の一部が失敗・検証落ちしたとき、成功分を push したうえで赤にする。
#
# ■ pull_request（ja を編集した PR）
#   translate は GEMINI_API_KEY があり、同一リポジトリの PR で、head が develop / main / master でなく、
#   翻訳コミット（github-actions[bot] の push）の実行でないときだけ、PR で変更された記事を `--write --since <base>` で処理する（1 回あたり I18N_MAX_ITEMS=500 件まで。
#   2026-10-23 に全記事を推敲したとき、20 件の上限で PR ごとの翻訳が止まり、手作業のバックフィルが要った。
#   代表の依頼で、全記事（今は 31 本 × 4 言語 = 124 件）を 1 回で訳せるようバックフィルと同じ値にした）。
#   i18n-check は translate / push の後に走る。push した場合は新しい HEAD 側の実行に検査を委ねて成功で終える。
#   push に使うトークン:
#     - 既定: GITHUB_TOKEN。GITHUB_TOKEN による PR 更新で作られる pull_request の実行は「承認待ち」になる
#       （GitHub Docs。本リポジトリでも実測: run 36329708078 が action_required）。approve-checks がそれを同じ
#       GITHUB_TOKEN で承認し、人の承認の操作を要らなくする。workflow_dispatch で起動し直す方式は使えない:
#       PR の必須チェックとして数えられるのは pull_request などの実行のチェックだけで、workflow_dispatch の実行の
#       チェックは success でも数えられない（GitHub Docs「Troubleshooting required status checks」。2026-10-25 に
#       PR #405 で実測: dispatch した 4 本はすべて success だったが、PR は BLOCKED のままだった）。
#     - 任意: secrets.TRANSLATION_BOT_TOKEN（fine-grained PAT / GitHub App）。push が通常の synchronize を起こし
#       全 CI が再実行されるが、GITHUB_TOKEN より権限・有効期間が広い。リスクは docs/i18n-translation.md 6 章。
#
# ■ workflow_dispatch
#   mode=translate … 既存記事のバックフィル（I18N_MAX_ITEMS=500）。chore/i18n-backfill-<YYYYMMDD> を push するまで。
#   mode=adopt     … 来歴の無い既存翻訳を採用（API 不要）。chore/i18n-adopt-<YYYYMMDD> を push するまで。
#                    どちらも PR は人が作る（リポジトリ設定で Actions による PR 作成は無効）。
#   mode=check     … 検査だけ。

on:
  pull_request:
    paths:
      - 'src/content/**'
      - 'scripts/i18n/**'
      - '.github/workflows/translate-content.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'translate = 翻訳してブランチを push / adopt = 既存翻訳を採用 / check = 検査のみ'
        type: choice
        options: [translate, adopt, check]
        default: translate
      collections:
        description: '対象コレクション（blog,cases,news をカンマ区切り。空 = 全部）'
        type: string
        default: ''
      langs:
        description: '対象言語（en,zh,ko,es をカンマ区切り。空 = 全部）'
        type: string
        default: ''
      only:
        description: '対象記事（slug または collection/slug をカンマ区切り。空 = 全記事）'
        type: string
        default: ''
      retranslate_untracked:
        description: '来歴の無い既存翻訳も訳し直す（mode=translate のときだけ有効）'
        type: boolean
        default: false
      since:
        description: 'この SHA からの差分に含まれる記事だけを検査する（mode=check のとき。通常は空）'
        type: string
        default: ''

# 既定は権限なし。各ジョブが必要な最小限だけを宣言する。
permissions: {}

# PR は PR ごとに 1 本（新しい push で古い実行を取り消す）。workflow_dispatch は実行ごとに別グループにして、
# 同じ ref に続けて起動した dispatch が待機中に置き換えられて消えないようにする。
concurrency:
  group: translate-content-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  # 翻訳が変更してよいパス（push ジョブがパッチを適用する前に照合する）。
  # scripts/i18n/config.mjs の COLLECTIONS / TARGET_LANGS と plan.mjs の SLUG_RE から機械的に決まる値で、
  # scripts/i18n/__tests__/workflow-link.test.mjs が両者の一致を検査する。
  ALLOWED_CHANGE_RE: '^src/content/(blog|cases|news)/(en|zh|ko|es)/[A-Za-z0-9][A-Za-z0-9._-]*\.md$'
  PATCH_ARTIFACT: i18n-translation-patch
  MAX_PATCH_BYTES: '5000000'
  # push ジョブで 1 回に削除してよい翻訳ファイルの上限: 翻訳ファイル数 × 25%（最低 4 件 = 記事 1 本分）。
  # scripts/i18n の I18N_MAX_PRUNE_RATIO の既定値と対象言語数と同じ値（workflow-link.test.mjs が照合する）。
  MAX_DELETE_PERCENT: '25'
  MIN_DELETE_ALLOWANCE: '4'

jobs:
  translate:
    name: translate
    # 統合ブランチ（develop→main のリリース PR 等）には CI から直接 push しない（PR 経由の原則）。
    # そこで翻訳の欠けが見つかった場合は i18n-check が赤になり、workflow_dispatch のバックフィルで直す。
    # 翻訳コミット（github-actions[bot] の push）の実行では訳さない。approve-checks がその実行を承認するので、
    # 訳すと「翻訳 → push → 承認」が人の手を通らずに繰り返されうる（i18n-check はその実行でも動く）
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'github-actions[bot]' &&
       !contains(fromJSON('["develop","main","master"]'), github.event.pull_request.head.ref)) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'check')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      patch: ${{ steps.patch.outputs.patch }}
      exit_code: ${{ steps.run.outputs.exit_code }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      MODE: ${{ inputs.mode }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - name: Decide whether to run
        id: plan
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HAS_GEMINI_KEY" != "true" ]; then
            echo "::notice title=i18n::GEMINI_API_KEY が未設定のため自動翻訳をスキップしました（docs/i18n-translation.md）"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MODE" = "translate" ] && [ "$HAS_GEMINI_KEY" != "true" ]; then
            echo "::error title=i18n::GEMINI_API_KEY が未設定です（docs/i18n-translation.md の「CEO が行う設定」）"
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.plan.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR は head（翻訳を積む先）、workflow_dispatch は起動した ref のコミット
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect content changes
        id: scope
        if: steps.plan.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && git diff --quiet "${BASE_SHA}...HEAD" -- src/content; then
            echo "src/content に変更が無いため翻訳は不要です"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "pull_request" ] && command -v node >/dev/null && node scripts/i18n/draft-only-diff.mjs --since "$BASE_SHA"; then
            # 追加された ja が isDraft: true の下書きだけのときは Gemini を呼ばない。
            # 公開記事の変更や、既存記事の isDraft 変更（meta-drift の同期）はここを通さない。
            echo "::notice title=i18n::追加された ja は isDraft: true の下書きだけなので、Gemini 翻訳をスキップしました"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.scope.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # 秘密情報（GEMINI_API_KEY）を扱うジョブなので npm キャッシュは使わない（cache poisoning 対策）

      - name: Install dependencies (install scripts disabled)
        if: steps.scope.outputs.changed == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Translate
        id: run
        if: steps.scope.outputs.changed == 'true'
        env:
          GEMINI_API_KEY: ${{ (github.event_name == 'pull_request' || inputs.mode == 'translate') && secrets.GEMINI_API_KEY || '' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          I18N_MAX_ITEMS: '500'
          COLLECTIONS: ${{ inputs.collections }}
          LANGS: ${{ inputs.langs }}
          ONLY: ${{ inputs.only }}
          RETRANSLATE_UNTRACKED: ${{ inputs.retranslate_untracked }}
        # 一部の記事が失敗しても成功した分は push したいので、終了コードを記録して translate-result で赤にする。
        run: |
          set -uo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            args=(--write --since "$BASE_SHA")
          elif [ "$MODE" = "adopt" ]; then
            args=(--adopt --collections "${COLLECTIONS:-}" --langs "${LANGS:-}" --only "${ONLY:-}")
          else
            args=(--write --collections "${COLLECTIONS:-}" --langs "${LANGS:-}" --only "${ONLY:-}")
            if [ "${RETRANSLATE_UNTRACKED:-false}" = "true" ]; then args+=(--retranslate-untracked); fi
          fi
          node scripts/i18n/translate-content.mjs "${args[@]}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Build the translation patch
        id: patch
        if: steps.scope.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/i18n-patch"
          git add -- src/content
          # --no-renames: ja の改名（slug 変更）では旧 slug の翻訳を削除し新 slug を作る。内容が似ていると git は
          # 既定で「改名」として出力し、push ジョブの検査（通常ファイルの作成・削除だけを許可）が拒否してしまう。
          git diff --cached --binary --no-renames -- src/content > "$RUNNER_TEMP/i18n-patch/translation.patch"
          if [ -s "$RUNNER_TEMP/i18n-patch/translation.patch" ]; then
            git diff --cached --stat -- src/content
            echo "patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "翻訳の変更はありません"
            echo "patch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the translation patch
        if: steps.patch.outputs.patch == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PATCH_ARTIFACT }}
          path: ${{ runner.temp }}/i18n-patch/translation.patch
          retention-days: 1
          if-no-files-found: error

  push:
    name: push
    needs: translate
    if: ${{ !cancelled() && needs.translate.result == 'success' && needs.translate.outputs.patch == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # 翻訳コミットを PR の head / chore/i18n-* ブランチへ push する
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      commit: ${{ steps.push.outputs.commit }}
      via: ${{ steps.push.outputs.via }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      MODE: ${{ inputs.mode }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout (the commit the patch was made from)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download the translation patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PATCH_ARTIFACT }}
          path: ${{ runner.temp }}/i18n-patch

      # パッチは信頼しないジョブの出力なので、「どこを・どういう種類で・何件変えるか」と、適用後の中身の NUL と
      # frontmatter の 1 行目（(5)）を検査して適用する。本文の妥当性はここでは見ない（i18n-check と PR のレビューで見る）。
      - name: Verify and apply the patch
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/i18n-patch/translation.patch"
          size="$(wc -c < "$patch" | tr -d ' ')"
          if [ "$size" -gt "$MAX_PATCH_BYTES" ]; then
            echo "::error title=i18n::パッチが大きすぎるため適用しません（${size} bytes > ${MAX_PATCH_BYTES}）"
            exit 1
          fi
          fail=0
          # (1) 変更パス: 翻訳ディレクトリの .md だけ。numstat は「追加<TAB>削除<TAB>パス」（バイナリは "-"）
          numstat="$(git apply --numstat "$patch")"
          if [ -z "$numstat" ]; then
            echo "::error title=i18n::パッチに変更がありません"
            exit 1
          fi
          count_re='^[0-9]+$'
          while IFS=$'\t' read -r added deleted file; do
            if [[ "$added" =~ $count_re ]] && [[ "$deleted" =~ $count_re ]] && [[ "$file" =~ $ALLOWED_CHANGE_RE ]]; then
              continue
            fi
            echo "::error title=i18n::許可されていない変更のため適用しません: ${added} ${deleted} ${file}"
            fail=1
          done <<< "$numstat"
          # (2) ファイル種別: 通常ファイル（100644）の作成・削除だけ。シンボリックリンク・実行権限・改名は拒否
          summary_re='^ (create|delete) mode 100644 (.+)$'
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if [[ "$line" =~ $summary_re ]]; then
              changed="${BASH_REMATCH[2]}"
              if [[ "$changed" =~ $ALLOWED_CHANGE_RE ]]; then continue; fi
            fi
            echo "::error title=i18n::許可されていない種類の変更のため適用しません: ${line}"
            fail=1
          done <<< "$(git apply --summary "$patch")"
          if [ "$fail" -ne 0 ]; then exit 1; fi
          # (3) 削除件数: 翻訳ファイル数 × MAX_DELETE_PERCENT%（最低 MIN_DELETE_ALLOWANCE 件）まで
          total="$(git ls-tree -r --name-only HEAD -- src/content | grep -cE "$ALLOWED_CHANGE_RE" || true)"
          deletions="$(git apply --summary "$patch" | grep -c '^ delete mode ' || true)"
          allowance=$(( total * MAX_DELETE_PERCENT / 100 ))
          if [ "$allowance" -lt "$MIN_DELETE_ALLOWANCE" ]; then allowance="$MIN_DELETE_ALLOWANCE"; fi
          if [ "$deletions" -gt "$allowance" ]; then
            echo "::error title=i18n::削除が多すぎるため適用しません（${deletions} 件 / 翻訳 ${total} 件、上限 ${allowance} 件）"
            exit 1
          fi
          git apply --check "$patch"
          git apply --index "$patch"
          # 適用した後の検査に落ちたら、stage も作業ツリーも元に戻してから失敗させる
          reject() {
            echo "::error title=i18n::$1"
            git reset -q --hard HEAD
            exit 1
          }
          # (4) stage された内容を 1 行ずつ照合する（パッチの見た目ではなく、実際に index に入ったもの）。
          #     改名は検出しない（--no-renames）ので、保護パスからの改名は「保護パスの削除」として拒否される。
          #     状態は A/M/D、モードは通常ファイル 100644（無しは 000000）、パスは翻訳ディレクトリの .md だけ。
          tab=$'\t'
          raw_re="^:([0-7]{6}) ([0-7]{6}) [0-9a-f]+ [0-9a-f]+ ([A-Z])[0-9]*${tab}(.+)\$"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            [[ "$line" =~ $raw_re ]] || reject "許可されていない変更が stage されました: ${line}"
            status="${BASH_REMATCH[3]}:${BASH_REMATCH[1]}:${BASH_REMATCH[2]}"
            file="${BASH_REMATCH[4]}"
            case "$status" in
              A:000000:100644 | D:100644:000000 | M:100644:100644) ;;
              *) reject "許可されていない種類の変更が stage されました: ${line}" ;;
            esac
            [[ "$file" =~ $ALLOWED_CHANGE_RE ]] || reject "許可されていないパスが stage されました: ${file}"
            # (5) 追加・変更した .md は NUL を含まず、1 行目は厳密に "---"（Astro が使う gray-matter は "---js" の
            #     frontmatter を JavaScript として評価するため。翻訳パイプラインの書き出しは常に "---" で始まる）。
            #     NUL を先に見る: テキストのハンクに NUL を入れたパッチは numstat でテキスト扱いになり (1) を通り、
            #     bash の read は NUL を捨てるので "---\0" の行も "---" に見える
            if [ "${status%%:*}" != "D" ]; then
              bytes="$(git cat-file -s ":$file")"
              nonul="$(git cat-file -p ":$file" | tr -d '\000' | wc -c | tr -d ' ')"
              [ "$bytes" = "$nonul" ] || reject "NUL を含むファイルは適用しません: ${file}"
              first=""
              IFS= read -r first < <(git cat-file -p ":$file") || true
              [ "$first" = "---" ] || reject "frontmatter の 1 行目が --- ではありません: ${file}（${first:0:40}）"
            fi
          done < <(git diff --cached --raw --no-renames --no-abbrev)
          git diff --cached --stat

      - name: Commit and push
        id: push
        env:
          BOT_TOKEN: ${{ github.event_name == 'pull_request' && secrets.TRANSLATION_BOT_TOKEN || '' }}
          FALLBACK_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          count="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git check-ref-format --branch "$HEAD_REF" > /dev/null
            target="$HEAD_REF"
            message="chore(i18n): ja の変更に合わせて翻訳を同期（${count} ファイル）"
            if [ -n "$BOT_TOKEN" ]; then token="$BOT_TOKEN"; via="bot_token"; else token="$FALLBACK_TOKEN"; via="github_token"; fi
          else
            kind="backfill"
            if [ "$MODE" = "adopt" ]; then kind="adopt"; fi
            target="chore/i18n-${kind}-$(date -u +%Y%m%d)"
            message="chore(i18n): 既存記事の翻訳を${kind}（${count} ファイル）"
            token="$FALLBACK_TOKEN"
            via="github_token"
          fi
          remote="https://x-access-token:${token}@github.com/${GITHUB_REPOSITORY}.git"
          if [ "$EVENT_NAME" != "pull_request" ] && git ls-remote --exit-code --heads "$remote" "$target" > /dev/null; then
            target="${target}-${RUN_ID}"
          fi
          git -c core.hooksPath=/dev/null \
              -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "$message" -m "翻訳パイプライン（ADR-0019）による自動コミット。"
          if ! git -c core.hooksPath=/dev/null push "$remote" "HEAD:refs/heads/${target}"; then
            echo "::error title=i18n::push できませんでした（PR に新しいコミットが追加された場合は、その実行で処理し直されます）"
            exit 1
          fi
          {
            echo "pushed=true"
            echo "commit=$(git rev-parse HEAD)"
            echo "via=${via}"
          } >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" != "pull_request" ]; then
            {
              echo "### i18n ${kind}"
              echo "ブランチ \`${target}\` を push しました（${count} ファイル）。PR を作成してください:"
              echo "https://github.com/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${target}?expand=1"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  approve-checks:
    name: approve-checks
    # translate-result も待つ: このジョブが最後に承認する実行は、同じ concurrency グループのこの実行を取り消すので、
    # translate-result がまだ終わっていないと、一部の翻訳の失敗が知らされない
    needs: [push, translate-result]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.push.outputs.pushed == 'true' && needs.push.outputs.via == 'github_token' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # 翻訳コミットの承認待ちの実行を承認するだけ（checkout もせず、リポジトリのコードも動かさない）
      pull-requests: read # PR の今の head のコミットを読む（人が新しいコミットを積んだかを見る）
    env:
      COMMIT: ${{ needs.push.outputs.commit }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # develop / main の必須チェック（verify・Chromium visual text audit・h5-admission）を出すワークフロー。
      # docs/i18n-translation.md 6 章の一覧と scripts/i18n/__tests__/required-check-approval.test.mjs が照合する。
      REQUIRED_WORKFLOWS: >-
        .github/workflows/ci.yml
        .github/workflows/visual-text.yml
        .github/workflows/h5-admission.yml
    steps:
      # GITHUB_TOKEN の push で作られる pull_request の実行は承認待ち（REST では status=completed、
      # conclusion=action_required）になる。それを同じ GITHUB_TOKEN で承認する（2026-10-25 に実測: approve API は
      # HTTP 201 を返し、実行が動き出した）。承認するのは、この翻訳コミット（head_sha）、このリポジトリのこの PR の
      # head ブランチ、pull_request の実行だけ。翻訳コミットは push ジョブが翻訳ディレクトリの .md だけだと照合済み
      # なので、承認して動くのは、PR の元の実行と同じワークフローだけ。
      - name: Approve the pull_request runs of the translation commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/actions/runs"
          self_path='.github/workflows/translate-content.yml'
          # この翻訳コミットの pull_request の実行を「ID ワークフローのパス 結論」の行で返す。問い合わせの条件に加えて
          # jq でも同じ条件を照合し、別のコミット・別のイベント・別のリポジトリ（fork）・別のブランチの実行は返さない
          runs() {
            gh api "${api}?head_sha=${COMMIT}&event=pull_request&per_page=100" --jq '.workflow_runs[]
              | select(.head_sha == env.COMMIT and .event == "pull_request" and .head_branch == env.HEAD_REF
                  and .head_repository.full_name == env.GITHUB_REPOSITORY)
              | "\(.id) \(.path) \(.conclusion // "-")"'
          }
          # 待つのは必須チェックの 3 本とこのワークフロー。base が develop / main 以外の PR では ci.yml と
          # visual-text.yml が動かないので、h5-admission.yml とこのワークフローだけを待つ。
          # base が main でも、main だけの必須チェック（build_and_deploy・guard）は待たない。main 宛ての PR は head が
          # develop でなければ guard が落とし、head が develop なら translate が動かないので、翻訳コミットは積まれない
          # （積まれても、承認待ちの実行はワークフローを問わずすべて承認する）
          wait_for="$REQUIRED_WORKFLOWS"
          if [ "$BASE_REF" != develop ] && [ "$BASE_REF" != main ]; then wait_for='.github/workflows/h5-admission.yml'; fi
          wait_for="${wait_for} ${self_path}"
          # 実行は push の数秒後に作られる。待つワークフローの実行が出そろうまで、3 分まで待つ。
          # listed="$(runs)" のように代入で受ける（here-string の中の $(…) は、失敗しても set -e で止まらない）
          deadline=$(( $(date +%s) + 180 ))
          while :; do
            listed="$(runs)"
            missing=''
            for wf in $wait_for; do
              grep -qF " ${wf} " <<< "$listed" || missing="${missing} ${wf}"
            done
            [ -z "$missing" ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error title=i18n::翻訳コミット ${COMMIT} の pull_request の実行が、3 分待っても作られませんでした:${missing}（docs/i18n-translation.md 6 章）"
              exit 1
            fi
            sleep 5
          done
          sleep 5 # 同じ push で作られるほかのワークフロー（deploy.yml など）の実行も待つ
          listed="$(runs)"
          # 人が PR に新しいコミットを積んでいたら承認しない。古いコミットの実行を承認すると、同じ concurrency
          # グループの新しいコミットの実行（verify など）を取り消してしまう。PR の今の head は PR の番号で読む
          # （ブランチ名で実行を探すと、同じ名前のブランチを持つ fork の PR の実行を拾い、名前に + # & % があると
          # 問い合わせが壊れる。2026-10-25、#409 のレビュー）。取れなければ赤にする
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha // empty')"
          if [ -z "$latest" ]; then
            echo "::error title=i18n::PR #${PR_NUMBER} の head のコミットを取得できませんでした。docs/i18n-translation.md 6 章の手順で承認してください"
            exit 1
          fi
          if [ "$latest" != "$COMMIT" ]; then
            echo "::notice title=i18n::PR #${PR_NUMBER} に新しいコミット（${latest}）が積まれたので、翻訳コミット ${COMMIT} の実行は承認しません"
            exit 0
          fi
          # このワークフローの実行は最後に承認する。承認した実行は、同じ concurrency グループのこの実行を取り消す。
          # 先に承認すると、ほかの実行を承認する前にこのジョブが止まる
          approved=''
          failed=''
          self=''
          while read -r id path conclusion; do
            [ "$conclusion" = action_required ] || continue
            if [ "$path" = "$self_path" ]; then self="$id"; continue; fi
            if gh api -X POST "${api}/${id}/approve" > /dev/null < /dev/null; then
              approved="${approved} ${id}"
            else
              failed="${failed} ${id}"
            fi
          done <<< "$listed"
          # 承認したあとも承認待ちのままの必須チェックの実行があれば、赤にして人に知らせる
          listed="$(runs)"
          for wf in $wait_for; do
            [ "$wf" = "$self_path" ] && continue
            if grep -qF " ${wf} action_required" <<< "$listed"; then failed="${failed} ${wf}"; fi
          done
          if [ -n "$failed" ]; then
            echo "::error title=i18n::承認できなかった実行があります（run:${failed}）。PR #${PR_NUMBER} の Checks で「Approve workflows to run」を押すか、docs/i18n-translation.md 6 章の手順で承認してください"
            exit 1
          fi
          echo "::notice title=i18n::翻訳コミット ${COMMIT} の承認待ちの実行を承認しました（run:${approved:- なし}${self:+、最後に ${self}}）"
          if [ -n "$self" ] && ! gh api -X POST "${api}/${self}/approve" > /dev/null; then
            echo "::error title=i18n::i18n-check の実行（run ${self}）を承認できませんでした。PR #${PR_NUMBER} の Checks で「Approve workflows to run」を押してください"
            exit 1
          fi

  translate-result:
    name: translate-result
    needs: [translate, push]
    if: ${{ !cancelled() && needs.translate.outputs.exit_code != '' && needs.translate.outputs.exit_code != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report rejected items
        env:
          EXIT_CODE: ${{ needs.translate.outputs.exit_code }}
          PUSHED: ${{ needs.push.outputs.pushed }}
        run: |
          echo "::error title=i18n::一部の翻訳・同期・削除が失敗または検証に通らず、反映されませんでした（exit ${EXIT_CODE}、成功分の push: ${PUSHED:-なし}）。translate ジョブの Translate ステップのログを確認してください"
          exit 1

  i18n-check:
    name: i18n-check
    needs: [translate, push]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || inputs.mode == 'check') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Delegate to the translation commit
        id: delegate
        if: github.event_name == 'pull_request' && needs.push.outputs.pushed == 'true'
        env:
          COMMIT: ${{ needs.push.outputs.commit }}
        run: |
          echo "delegated=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=i18n::翻訳コミット ${COMMIT} を push しました。i18n-check はそのコミットに対して実行されます"

      - name: Checkout
        if: steps.delegate.outputs.delegated != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        if: steps.delegate.outputs.delegated != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (install scripts disabled)
        if: steps.delegate.outputs.delegated != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Unit tests (scripts/i18n)
        if: steps.delegate.outputs.delegated != 'true'
        run: npx vitest run scripts/i18n

      - name: Check translations
        if: steps.delegate.outputs.delegated != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SINCE: ${{ inputs.since }}
          COLLECTIONS: ${{ inputs.collections }}
          LANGS: ${{ inputs.langs }}
          ONLY: ${{ inputs.only }}
        run: |
          set -uo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            args=(--check --since "$BASE_SHA")
          elif [ -n "${SINCE:-}" ]; then
            args=(--check --since "$SINCE")
          else
            args=(--check --collections "${COLLECTIONS:-}" --langs "${LANGS:-}" --only "${ONLY:-}")
          fi
          node scripts/i18n/translate-content.mjs "${args[@]}" > i18n-report.txt 2>&1
          code=$?
          cat i18n-report.txt
          {
            echo "### i18n-check"
            echo '```'
            cat i18n-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
